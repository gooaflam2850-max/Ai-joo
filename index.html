<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6750A4">
<title>My Local AI</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,"Tahoma",sans-serif;
    background:#f6f5f8;
    color:#202124;
}

body{
    display:flex;
    flex-direction:column;
}

/* Header */
.header{
    height:64px;
    background:#6750A4;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    flex-shrink:0;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    opacity:.95;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#aaa;
}

.status-dot.online{
    background:#35d07f;
}

/* Chat */
#chat{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 100px;
    scroll-behavior:smooth;
}

.welcome{
    max-width:600px;
    margin:40px auto;
    text-align:center;
    padding:25px;
}

.welcome-icon{
    font-size:48px;
    margin-bottom:12px;
}

.welcome h2{
    margin:0 0 10px;
    font-size:24px;
}

.welcome p{
    margin:0;
    color:#777;
    line-height:1.8;
}

.message{
    max-width:min(85%,700px);
    padding:12px 15px;
    margin:10px 0;
    border-radius:17px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
    animation:appear .18s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.user{
    margin-right:auto;
    background:#6750A4;
    color:white;
    border-bottom-right-radius:5px;
}

.ai{
    margin-left:auto;
    background:white;
    color:#222;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    border-bottom-left-radius:5px;
}

.time{
    display:block;
    margin-top:5px;
    font-size:10px;
    opacity:.55;
}

/* Input */
.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:10px;
    background:rgba(255,255,255,.96);
    border-top:1px solid #ddd;
    backdrop-filter:blur(8px);
}

.input-row{
    max-width:850px;
    margin:auto;
    display:flex;
    gap:8px;
}

#input{
    flex:1;
    min-width:0;
    height:48px;
    border:1px solid #d2d2d2;
    border-radius:15px;
    padding:0 15px;
    font-size:16px;
    outline:none;
    background:white;
}

#input:focus{
    border-color:#6750A4;
}

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

.send{
    width:55px;
    border-radius:15px;
    background:#6750A4;
    color:white;
    font-size:20px;
}

.send:active{
    transform:scale(.96);
}

.actions{
    max-width:850px;
    margin:7px auto 0;
    display:flex;
    justify-content:flex-start;
    gap:7px;
}

.small-btn{
    background:#eeeaf5;
    color:#4c397d;
    padding:7px 11px;
    border-radius:9px;
    font-size:12px;
}

/* Typing */
.typing{
    display:flex;
    gap:4px;
    align-items:center;
}

.typing span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#777;
    animation:bounce 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:translateY(0);
    }
    40%{
        transform:translateY(-5px);
    }
}

/* Mobile */
@media(max-width:600px){
    .header{
        height:58px;
    }

    .title{
        font-size:18px;
    }

    .message{
        max-width:90%;
    }

    #chat{
        padding-left:9px;
        padding-right:9px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="title">My Local AI</div>

    <div class="status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">جاهز</span>
    </div>
</header>

<main id="chat">

    <div id="welcome" class="welcome">
        <div class="welcome-icon">🤖</div>
        <h2>مرحبًا بك</h2>
        <p>
            أنا مساعدك الذكي المحلي.<br>
            اكتب رسالتك للبدء.
        </p>
    </div>

</main>

<div class="input-area">

    <div class="input-row">

        <input
            id="input"
            type="text"
            autocomplete="off"
            placeholder="اكتب رسالتك..."
        >

        <button
            class="send"
            id="sendBtn"
            onclick="sendMessage()"
        >➤</button>

    </div>

    <div class="actions">
        <button class="small-btn" onclick="newChat()">
            محادثة جديدة
        </button>

        <button class="small-btn" onclick="clearChat()">
            مسح المحادثة
        </button>
    </div>

</div>

<script>
"use strict";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");
const welcome = document.getElementById("welcome");

let messages = [];

const STORAGE_KEY = "my_local_ai_chat_v1";

/* -------------------------
   Storage
------------------------- */

function saveChat(){
    try{
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(messages)
        );
    }catch(error){
        console.error("Storage error:",error);
    }
}

function loadChat(){

    try{

        const saved = localStorage.getItem(STORAGE_KEY);

        if(!saved) return;

        const data = JSON.parse(saved);

        if(!Array.isArray(data)) return;

        messages = data;

        for(const message of messages){

            addMessageToUI(
                message.text,
                message.role,
                message.time
            );
        }

        if(messages.length > 0){
            welcome.style.display = "none";
        }

    }catch(error){
        console.error("Load error:",error);
    }
}

/* -------------------------
   UI
------------------------- */

function getTime(){

    return new Date().toLocaleTimeString(
        "ar-EG",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

function addMessageToUI(text,role,time){

    welcome.style.display = "none";

    const div = document.createElement("div");

    div.className =
        "message " +
        (role === "user" ? "user" : "ai");

    div.textContent = text;

    if(time){

        const small = document.createElement("span");

        small.className = "time";

        small.textContent = time;

        div.appendChild(small);
    }

    chat.appendChild(div);

    scrollToBottom();

    return div;
}

function addMessage(text,role){

    const time = getTime();

    messages.push({
        role,
        text,
        time
    });

    saveChat();

    return addMessageToUI(
        text,
        role,
        time
    );
}

function scrollToBottom(){

    setTimeout(()=>{
        chat.scrollTop = chat.scrollHeight;
    },20);
}

/* -------------------------
   Typing
------------------------- */

function createTyping(){

    welcome.style.display = "none";

    const div = document.createElement("div");

    div.className = "message ai";

    div.id = "typing";

    div.innerHTML = `
        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    chat.appendChild(div);

    scrollToBottom();

    return div;
}

/* -------------------------
   AI ENGINE
------------------------- */

/*
    هنا هنربط محرك الذكاء الاصطناعي الحقيقي لاحقًا.

    حاليًا الموقع يعمل بدون محرك خارجي.
*/

async function askAI(prompt){

    /*
       مؤقتًا:
       نرجع رسالة توضح أن المحرك لم يتم ربطه.
    */

    await new Promise(
        resolve => setTimeout(resolve,500)
    );

    return "الموقع يعمل بنجاح، لكن محرك الذكاء الاصطناعي الحقيقي لم يتم ربطه بعد.";
}

/* -------------------------
   Send
------------------------- */

async function sendMessage(){

    const prompt = input.value.trim();

    if(!prompt) return;

    input.value = "";

    sendBtn.disabled = true;

    statusText.textContent = "يفكر...";
    statusDot.classList.add("online");

    addMessage(prompt,"user");

    const typing = createTyping();

    try{

        const response = await askAI(prompt);

        typing.remove();

        addMessage(
            response,
            "ai"
        );

        statusText.textContent = "جاهز";

    }catch(error){

        console.error(error);

        typing.remove();

        addMessage(
            "حدث خطأ أثناء تشغيل الذكاء الاصطناعي.",
            "ai"
        );

        statusText.textContent = "خطأ";

    }finally{

        sendBtn.disabled = false;

        input.focus();
    }
}

/* -------------------------
   New Chat
------------------------- */

function newChat(){

    messages = [];

    localStorage.removeItem(STORAGE_KEY);

    chat.innerHTML = "";

    chat.appendChild(welcome);

    welcome.style.display = "block";

    statusText.textContent = "جاهز";
    statusDot.classList.remove("online");

    input.focus();
}

/* -------------------------
   Clear
------------------------- */

function clearChat(){

    messages = [];

    saveChat();

    const elements =
        chat.querySelectorAll(".message");

    elements.forEach(
        element => element.remove()
    );

    welcome.style.display = "block";

    statusText.textContent = "جاهز";

    input.focus();
}

/* -------------------------
   Keyboard
------------------------- */

input.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();
        }
    }
);

/* -------------------------
   Start
------------------------- */

loadChat();

input.focus();

</script>

</body>
  </html>
