<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Inventor - Flashlight Maker</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121218; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
    
    header { background: #1e1e26; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2d2d3a; }
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn { background: #2d2d3a; color: #aaa; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #ff9f43; color: #000; }

    .workspace { display: flex; flex: 1; overflow: hidden; }
    .view-panel { display: none; width: 100%; height: 100%; }
    .view-panel.active { display: flex; }

    /* التصميم Designer */
    .palette { width: 220px; background: #1e1e26; padding: 15px; border-left: 2px solid #2d2d3a; }
    .comp-item { background: #ff9f43; color: #000; padding: 10px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; }
    .viewer { flex: 1; display: flex; justify-content: center; align-items: center; background: #0a0a0f; }
    .phone { width: 260px; height: 460px; background: #222; border: 10px solid #333; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; }
    .phone-header { background: #333; color: #fff; padding: 10px; text-align: center; font-size: 13px; }
    .phone-body { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 10px; justify-content: center; align-items: center; }
    .btn-preview { background: #ff9f43; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
    .btn-preview.active { background: #00d2d3; color: #fff; }

    /* البلوكات Blocks */
    .blocks-sidebar { width: 280px; background: #1e1e26; padding: 15px; border-left: 2px solid #2d2d3a; display: flex; flex-direction: column; gap: 15px; }
    .block-category { background: #2a2a36; padding: 10px; border-radius: 8px; }
    .cat-title { font-size: 12px; color: #8a8a9e; margin-bottom: 8px; font-weight: bold; }
    
    .b-btn { display: block; width: 100%; padding: 10px; margin-bottom: 6px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; text-align: right; }
    .b-event { background: #ff9f43; color: #000; }
    .b-action { background: #54a0ff; color: #fff; }
    .b-target { background: #10ac84; color: #fff; }

    .blocks-canvas { flex: 1; background: #0a0a0f; padding: 20px; overflow-y: auto; }
    .puzzle-card { background: #1e1e26; border-radius: 10px; padding: 15px; border-right: 6px solid #ff9f43; margin-bottom: 15px; }
    .puzzle-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .badge { padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; }
    .badge-event { background: #ff9f43; color: #000; }
    .badge-action { background: #54a0ff; color: #fff; }
    .badge-target { background: #10ac84; color: #fff; }

    .test-btn { background: #10ac84; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .status-box { margin-top: 10px; font-size: 12px; color: #aaa; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h2>🧩 صانع تطبيق الفلاش</h2>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('designer')">📱 الشاشة</button>
      <button class="tab-btn" onclick="switchTab('blocks')">🧩 البلوكات</button>
    </div>
    <button class="test-btn" onclick="runApp()">▶️ تجربة الفلاش</button>
  </header>

  <div class="workspace">
    
    <!-- 1. شاشة التصميم -->
    <div id="designer-view" class="view-panel active">
      <div class="palette">
        <div class="cat-title">إضافة عناصر</div>
        <div class="comp-item" onclick="addFlashButton()">➕ إضافة زرار الفلاش</div>
      </div>
      <div class="viewer">
        <div class="phone">
          <div class="phone-header">تطبيق الكشاف</div>
          <div class="phone-body" id="phoneBody">
            <p style="color:#777; font-size: 12px;">أضف زرار أولاً...</p>
          </div>
          <div id="statusMsg" class="status-box"></div>
        </div>
      </div>
    </div>

    <!-- 2. شاشة البلوكات -->
    <div id="blocks-view" class="view-panel">
      <div class="blocks-sidebar">
        
        <div class="block-category">
          <div class="cat-title">1. الزرار (Event)</div>
          <button class="b-btn b-event" onclick="setStep('event', 'عند الضغط على [زرار 1]')">🟠 عند الضغط على زرار 1</button>
        </div>

        <div class="block-category">
          <div class="cat-title">2. الفعل (Action)</div>
          <button class="b-btn b-action" onclick="setStep('action', 'تشغيل')">🔵 تشغيل / إيقاف</button>
        </div>

        <div class="block-category">
          <div class="cat-title">3. الهدف (Target)</div>
          <button class="b-btn b-target" onclick="setStep('target', 'فلاش الهاتف')">🟢 فلاش الهاتف</button>
        </div>

      </div>

      <div class="blocks-canvas">
        <h3 style="color:#aaa; margin-top:0;">التركيب البرمجي:</h3>
        
        <div class="puzzle-card">
          <div style="color:#8a8a9e; font-size: 13px;">الأمر البرمجي الحالي:</div>
          <div class="puzzle-row">
            <span id="slot-event" class="badge badge-event">أختر الزرار...</span>
            <span>⬅️</span>
            <span id="slot-action" class="badge badge-action">أختر الفعل...</span>
            <span id="slot-target" class="badge badge-target">أختر الهدف...</span>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    let hasButton = false;
    let rule = { event: null, action: null, target: null };
    let track = null;
    let isFlashOn = false;

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));

      if (tab === 'designer') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('designer-view').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('blocks-view').classList.add('active');
      }
    }

    function addFlashButton() {
      const phoneBody = document.getElementById('phoneBody');
      phoneBody.innerHTML = '<button class="btn-preview" id="phoneBtn">💡 تشغيل الفلاش</button>';
      hasButton = true;
    }

    function setStep(type, text) {
      rule[type] = text;
      
      if(type === 'event') document.getElementById('slot-event').textContent = text;
      if(type === 'action') document.getElementById('slot-action').textContent = text;
      if(type === 'target') document.getElementById('slot-target').textContent = text;
    }

    function runApp() {
      switchTab('designer');
      const btn = document.getElementById('phoneBtn');
      const status = document.getElementById('statusMsg');
      
      if (!hasButton) {
        alert('من فضلك أضف الزرار أولاً من شاشة المصمم!');
        return;
      }

      if (!rule.event || !rule.action || !rule.target) {
        alert('من فضلك اكمل كود البلوكات أولاً (زرار ➔ تشغيل ➔ فلاش الهاتف)!');
        return;
      }

      btn.onclick = async () => {
        if (rule.target === 'فلاش الهاتف') {
          // حالة الإيقاف
          if (isFlashOn) {
            if (track) {
              track.stop();
              track = null;
            }
            isFlashOn = false;
            btn.textContent = '💡 تشغيل الفلاش';
            btn.classList.remove('active');
            status.textContent = 'تم إيقاف الكشاف';
            return;
          }

          // حالة التشغيل
          try {
            status.textContent = 'جاري طلب إذن الكاميرا...';
            
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { exact: 'environment' } }
            }).catch(async () => {
              return await navigator.mediaDevices.getUserMedia({ video: true });
            });

            track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};

            if (!capabilities.torch) {
              status.textContent = '⚠️ المتصفح لا يدعم الوصول للفلاش بشكل مباشر.';
              track.stop();
              return;
            }

            await track.applyConstraints({ advanced: [{ torch: true }] });
            isFlashOn = true;
            btn.textContent = '⚡ إيقاف الفلاش';
            btn.classList.add('active');
            status.textContent = 'الكشاف يعمل الآن!';

          } catch (err) {
            console.error(err);
            status.textContent = '⚠️ تأكد من تفعيل إذن الكاميرا وأن الرابط HTTPS';
          }
        }
      };

      alert('تم تفعيل الكود! اضغط الآن على زرار الفلاش داخل الموبايل لتجربته.');
    }
  </script>
</body>
</html>
