<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الذكاء الاصطناعي مع البحث المباشر</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --text-color: #1f2937;
            --bot-msg-bg: #e0e7ff;
            --user-msg-bg: #4f46e5;
            --user-text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background-color: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fafafa;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message.bot {
            background-color: var(--bot-msg-bg);
            color: #1e1b4b;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .message.user {
            background-color: var(--user-msg-bg);
            color: var(--user-text);
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #ffffff;
            border-top: 1px solid #e5e7eb;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--primary-color);
        }

        .chat-input-area button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            margin-right: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color: 0.3s;
        }

        .chat-input-area button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">مساعد الذكاء الاصطناعي (مع البحث الحي)</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">أهلاً بك! يمكنك سؤالي عن أي شيء وسأبحث لك عنه في الإنترنت.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب ما تريد البحث عنه..." autofocus>
            <button id="sendBtn">إبحث</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        async function searchTheWeb(query) {
            // استخدام خدمة DuckDuckGo البرمجية للبحث المباشر
            const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&kl=ar-eg`;
            
            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                const parsedData = JSON.parse(data.contents);

                if (parsedData.AbstractText) {
                    return parsedData.AbstractText;
                } else if (parsedData.RelatedTopics && parsedData.RelatedTopics.length > 0) {
                    // جلب أول نتيجة ذات صلة إذا لم يوجد ملخص مباشر
                    for (let topic of parsedData.RelatedTopics) {
                        if (topic.Text) return topic.Text;
                    }
                }
                
                return `لم أتمكن من العثور على إجابة مباشرة، يمكنك البحث بشكل أدق أو تجربة صياغة السؤال بطريقة أخرى.`;
            } catch (error) {
                console.error(error);
                return "حدث خطأ أثناء الاتصال بالإنترنت لجلب النتائج. تأكد من اتصال جهازك.";
            }
        }

        async function handleUserMessage() {
            const text = userInput.value.trim();
            if (text === "") return;

            appendMessage(text, 'user');
            userInput.value = "";

            // رسالة انتظار أثناء البحث
            const loadingMsg = appendMessage("جاري البحث في الإنترنت...", 'bot');

            // تنفيذ البحث الحي
            const searchResult = await searchTheWeb(text);
            
            // تحديث رسالة الانتظار بالنتيجة النهائية
            loadingMsg.textContent = searchResult;
        }

        sendBtn.addEventListener('click', handleUserMessage);
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleUserMessage();
            }
        });
    </script>
</body>
</html>
