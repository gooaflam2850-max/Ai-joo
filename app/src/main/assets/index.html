<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Local AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            font-family: sans-serif;
        }

        header {
            background: #6750A4;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 21px;
            font-weight: bold;
        }

        #chat {
            padding: 15px;
            padding-bottom: 90px;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .user {
            background: #6750A4;
            color: white;
            margin-right: auto;
        }

        .ai {
            background: white;
            color: #222;
            margin-left: auto;
            box-shadow: 0 1px 4px #ddd;
        }

        .input-box {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 8px;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        button {
            border: none;
            background: #6750A4;
            color: white;
            border-radius: 12px;
            padding: 0 18px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    My Local AI
</header>

<div id="chat"></div>

<div class="input-box">
    <input
        id="input"
        type="text"
        placeholder="اكتب رسالتك..."
        onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button onclick="sendMessage()">إرسال</button>
</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    return div;
}

function sendMessage() {

    const prompt = input.value.trim();

    if (!prompt) return;

    input.value = "";

    addMessage(prompt, "user");

    const aiMessage = addMessage("جاري التفكير...", "ai");

    if (
        typeof AndroidAI !== "undefined" &&
        typeof AndroidAI.generate === "function"
    ) {

        try {

            const result = AndroidAI.generate(prompt);

            aiMessage.textContent = result;

        } catch (error) {

            aiMessage.textContent =
                "حدث خطأ أثناء تشغيل المحرك المحلي.";

            console.error(error);
        }

    } else {

        aiMessage.textContent =
            "محرك الذكاء الاصطناعي غير متصل.";

    }
}

</script>

</body>
  </html>
